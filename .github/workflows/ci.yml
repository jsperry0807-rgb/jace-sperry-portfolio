name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Playwright report
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config > /dev/null

      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://example.com -t jace-sperry-portfolio:ci .

      - name: Smoke test container
        run: |
          trap 'docker rm -f portfolio-ci' EXIT
          docker run -d --name portfolio-ci -p 3200:3000 \
            -e NEXT_PUBLIC_SITE_URL=https://example.com \
            jace-sperry-portfolio:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3200/ > /dev/null; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:3200/ > /dev/null
          curl -fsS http://127.0.0.1:3200/writing > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/does-not-exist)" = "404"
          curl -fsSI http://127.0.0.1:3200/ | grep -qi 'content-security-policy'
